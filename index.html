<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Member Panel</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d1b;
      --panel: #111a2d;
      --gold: #ffca69;
      --text: #f5f7ff;
      --muted: #aab5cc;
      --border: #293650;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      margin: 16px 0;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    h1, h2, h3 { color: var(--gold); }

    label {
      display: block;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #080f20;
      color: var(--text);
    }

    button {
      padding: 12px 16px;
      margin: 5px 4px 5px 0;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #1a2943;
      color: var(--text);
      cursor: pointer;
    }

    button:hover, button.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary {
      background: var(--gold);
      color: #17120a;
      font-weight: bold;
    }

    .hidden { display: none !important; }

    .tabs, #tiktokServices, #tiktokPackageList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tt-service-button {
      flex: 1 1 140px;
      min-height: 48px;
    }

    .tt-country {
      text-align: left;
    }

    .message { margin-top: 12px; }
    .message.error { color: #ff8d96; }
    .message.success { color: #8ff0bd; }
    .muted { color: var(--muted); }

    #ttSelected {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .card { padding: 15px; }
      .tt-service-button { flex-basis: 100%; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="card">
      <h1>TikTok Member Panel</h1>
      <p class="muted">Secure customer account and TikTok services</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button type="button" class="tab active" data-view="login">
          Login
        </button>
        <button type="button" class="tab" data-view="register">
          Create Account
        </button>
      </div>

      <form id="loginForm">
        <h2>Customer Login</h2>

        <label for="loginUsername">Username</label>
        <input id="loginUsername" name="username"
          autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password"
          type="password" autocomplete="current-password" required>

        <button class="primary" type="submit">Login</button>
      </form>

      <form id="registerForm" class="hidden">
        <h2>Create Account</h2>

        <label for="registerName">Full Name</label>
        <input id="registerName" name="name" required>

        <label for="registerUsername">Username</label>
        <input id="registerUsername" name="username"
          minlength="3" required>

        <label for="registerPassword">Password</label>
        <input id="registerPassword" name="password"
          type="password" minlength="8" required>

        <button class="primary" type="submit">Register</button>
      </form>

      <p id="message" class="message" role="status"></p>
    </section>

    <!-- Services are visible after successful customer login -->
    <section id="memberArea" class="hidden">
      <section class="card">
        <h2 id="memberName">Welcome, Member</h2>
        <p>Account Status: <strong id="memberStatus">Approved</strong></p>
        <p>Credits: <strong id="memberCredits">0</strong></p>
        <button id="logoutBtn" type="button">Logout</button>
      </section>

      <section class="card">
        <h2>TikTok Services</h2>
        <p class="muted">Choose a service, then select its package.</p>

        <div id="tiktokServices">
          <button type="button" class="tt-service-button active"
            data-service="Followers">👥 Followers</button>

          <button type="button" class="tt-service-button"
            data-service="Likes">❤️ Likes</button>

          <button type="button" class="tt-service-button"
            data-service="Views">▶️ Views</button>

          <button type="button" class="tt-service-button"
            data-service="Add Favourite">⭐ Add Favourite</button>

          <button type="button" class="tt-service-button"
            data-service="Share">🔗 Share</button>

          <button type="button" class="tt-service-button"
            data-service="Comment">💬 Comment</button>
        </div>

        <h3>Select Package</h3>
        <div id="tiktokPackageList"></div>

        <div id="ttSelected" class="hidden"></div>
      </section>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
